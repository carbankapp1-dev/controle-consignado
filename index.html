<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle Consignado</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="theme-color" content="#111741">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --branco: #ffffff;
    --cinza-50: #f4f6f9;
    --cinza-100: #eef0f3;
    --cinza-200: #e2e6ea;
    --cinza-300: #cfd5dc;
    --cinza-500: #7a8694;
    --verde: #46da86;
    --verde-claro: #e4f9ed;
    --verde-forte: #1c9a55;
    --azul: #111741;
    --azul-2: #142037;
    --azul-claro: #e9ebf4;
    --alerta: #9a5b00;
    --alerta-bg: #fdf1dc;
    --perigo: #b42318;
    --perigo-bg: #fde8e6;
    --raio: 12px;
    --sombra: 0 1px 2px rgba(17,23,65,.06), 0 4px 14px rgba(17,23,65,.06);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--cinza-50); color: var(--azul);
    font: 14px/1.45 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; letter-spacing: .04em; }
  .muted { color: var(--cinza-500); }
  svg { display: block; }

  /* ---------- topo ---------- */
  .topo { border-bottom: 3px solid var(--verde); background: var(--branco); position: sticky; top: 0; z-index: 20; }
  .topo-in { max-width: 1280px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .marca { display: flex; align-items: center; gap: 10px; }
  .marca-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--azul); display: grid; place-items: center; }
  .marca h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .topo-dir { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .chip-loja { background: var(--verde-claro); border: 1px solid var(--verde); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .chip-loja small { font-weight: 500; color: var(--cinza-500); margin-left: 6px; }
  .tabs { max-width: 1280px; margin: 0 auto; padding: 0 20px; display: flex; gap: 4px; }
  .tab { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--cinza-500); border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .tab.on { color: var(--azul); border-bottom-color: var(--azul); }

  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 80px; }

  /* ---------- barra de filtros ---------- */
  .barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .busca { position: relative; flex: 1 1 240px; max-width: 360px; }
  .busca svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); }
  .busca input[type=search] { padding-left: 36px; }
  input[type=text], input[type=email], input[type=password], input[type=date], select, input[type=search] {
    width: 100%; height: 38px; padding: 0 11px; border: 1.5px solid var(--cinza-300); border-radius: 9px;
    background: var(--branco); color: var(--azul); transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(17,23,65,.12); }
  input[readonly] { background: var(--cinza-50); color: var(--cinza-500); }
  input.erro, select.erro { border-color: var(--perigo); background: var(--perigo-bg); }
  .sel-loja { flex: 0 1 260px; }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .fchip { border: 1.5px solid var(--cinza-200); background: var(--branco); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--azul); }
  .fchip b { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--cinza-100); font-size: 11.5px; }
  .fchip:hover { border-color: var(--azul); }
  .fchip.on { background: var(--azul); border-color: var(--azul); color: #fff; }
  .fchip.on b { background: rgba(255,255,255,.2); color: #fff; }

  /* ---------- lista (cada veículo = 1 cartão) ---------- */
  .cab, .row {
    display: grid; align-items: center; column-gap: 10px;
    grid-template-columns: 104px minmax(170px,1.7fr) 124px 88px 128px 128px 58px 112px 112px 34px;
  }
  .cab { padding: 0 16px 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--cinza-500); }
  .card { background: var(--branco); border: 1.5px solid #c5cad8; border-radius: var(--raio); box-shadow: 0 2px 6px rgba(17,23,65,.10); margin-bottom: 12px; overflow: hidden; }
  .card:hover { border-color: var(--azul); box-shadow: 0 3px 10px rgba(17,23,65,.16); }
  .card.entregue { background: var(--cinza-50); }
  .row { padding: 12px 16px; }
  .c { min-width: 0; }
  .c small { display: block; color: var(--cinza-500); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plate { display: inline-block; padding: 3px 9px; border: 1.5px solid var(--azul); border-radius: 6px; font-weight: 800; letter-spacing: .08em; font-family: ui-monospace, Consolas, monospace; background: #fff; }
  .c input[type=date] { height: 34px; font-size: 13px; padding: 0 8px; }
  .dtw { position: relative; }
  .dtw input.dtp { cursor: pointer; }
  .dtw input.dtp.vazio { color: transparent; }
  .dtw .dtph { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 12.5px; color: var(--cinza-500); pointer-events: none; }
  .c input.vv { height: 34px; font-size: 13px; font-weight: 700; padding: 0 6px; }
  .c input.vv.zero { color: #d32f2f; }
  .c:has(> .cont) { position: relative; }
  .card:has(.cont) > .row { padding-bottom: 28px; }
  .cont { position: absolute; left: 0; right: 0; top: 100%; margin-top: 3px; text-align: center; font-size: 11.5px; font-weight: 700; line-height: 1.2; color: var(--cinza-500); white-space: nowrap; }
  .cont.atraso { color: #d32f2f; }
  .laudo { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--verde-claro); border: 1px solid var(--verde); }
  .laudo:hover { background: var(--verde); }
  .dias { display: inline-flex; flex-direction: column; align-items: center; min-width: 48px; padding: 3px 8px; border-radius: 9px; font-weight: 800; font-size: 17px; line-height: 1.1; }
  .dias small { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: inherit; opacity: .8; }
  .dias.ok { background: var(--verde-claro); color: var(--verde-forte); }
  .dias.warn { background: var(--alerta-bg); color: var(--alerta); }
  .dias.danger { background: var(--perigo-bg); color: var(--perigo); }
  .dias.done, .dias.muted { background: var(--cinza-100); color: var(--cinza-500); }

  .stbtn { width: 100%; height: 38px; border-radius: 10px; border: 1.5px solid var(--cinza-300); background: var(--cinza-100); color: #3c4a59; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform .1s, background .15s; }
  .stbtn:active:not(:disabled) { transform: scale(.98); }
  .stbtn.idle:hover { background: var(--cinza-200); }
  .stbtn.wait { background: var(--azul-claro); border-color: var(--azul); color: var(--azul); }
  .stbtn.ok { background: var(--verde); border-color: var(--verde); color: var(--azul-2); }
  .stbtn.go { background: var(--azul); border-color: var(--azul); color: #fff; }
  .stbtn.go:hover { background: var(--azul-2); }
  .stbtn:disabled { opacity: .5; cursor: not-allowed; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--azul); animation: pulsa 1.4s infinite; }
  @keyframes pulsa { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }

  .row2 { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; padding: 12px 16px 14px; background: var(--cinza-50); border-top: 1px solid var(--cinza-200); }
  .card.entregue .row2 { background: var(--cinza-100); }
  .r2 label, .lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--cinza-500); margin-bottom: 5px; }
  .rastreio { display: flex; gap: 6px; align-items: center; }
  .rastreio input { width: 168px; text-transform: uppercase; }
  .ibtn { width: 38px; height: 38px; border-radius: 9px; border: 1.5px solid var(--cinza-300); background: #fff; display: grid; place-items: center; flex: none; }
  .ibtn:hover { border-color: var(--azul); background: var(--azul-claro); }
  .lnk { font-size: 12.5px; font-weight: 600; color: var(--azul); text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  .dl { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 9px; border: 1.5px solid var(--verde); background: var(--verde-claro); font-weight: 700; font-size: 12.5px; margin-right: 6px; }
  .dl:hover { background: var(--verde); }


  .vazio { text-align: center; padding: 60px 20px; color: var(--cinza-500); border: 2px dashed var(--cinza-200); border-radius: var(--raio); }
  .vazio h3 { color: var(--azul); margin: 10px 0 4px; }
  .mais { display: block; margin: 14px auto 0; padding: 10px 22px; border-radius: 10px; border: 1.5px solid var(--azul); background: #fff; font-weight: 700; }

  /* ---------- botões gerais ---------- */
  .btn { height: 40px; padding: 0 18px; border-radius: 10px; border: 1.5px solid var(--azul); background: #fff; color: var(--azul); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { background: var(--azul-claro); }
  .btn.pri { background: var(--azul); color: #fff; }
  .btn.pri:hover { background: var(--azul-2); }
  .btn.finaliza { background: #111741; border-color: #111741; color: #fff; margin-left: auto; }
  .btn.finaliza:hover { background: #142037; border-color: #142037; }
  .r2-rast { flex: 1 1 420px; }
  .r2-rast .rastreio { width: 100%; }
  .ibtn.del { width: 32px; height: 32px; color: #8a96a3; border-color: transparent; background: transparent; }
  .ibtn.del:hover { color: var(--perigo); border-color: var(--perigo); background: var(--perigo-bg); }
  .c-del { justify-self: end; }
  .btn.laranja { background: #f6a23a; border-color: #e8912a; color: var(--azul); }
  .btn.laranja:hover { background: #f1932a; }
  .btn.verde { background: var(--verde); border-color: var(--verde); color: var(--azul-2); }
  .btn.verde:hover { background: #3cc878; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; }

  /* ---------- painéis (importar / lojas) ---------- */
  .dest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .dest-grid { grid-template-columns: 1fr; } }
  .dest-lista { margin: 12px 0; }
  .dest-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--cinza-200); }
  .dest-chk { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .dest-chk, .dest-chk * { cursor: pointer; }
  .dest-chk input { width: 18px; height: 18px; margin: 0; accent-color: var(--azul); flex: none; }
  .dest-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #e3f6e6; color: #1b6b2f; flex: none; }
  .dest-item.off .dest-mail { color: var(--cinza-500); text-decoration: line-through; font-weight: 500; }
  .dest-item.off .dest-tag { background: var(--cinza-200); color: var(--cinza-500); }
  .dest-aviso { margin-top: 10px; padding: 8px 12px; border-radius: 9px; background: #fff4e0; color: #8a5300; font-size: 13px; }
  .dest-mail { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; color: var(--azul); }
  .dest-novo { display: flex; gap: 8px; margin-top: 8px; }
  .dest-novo input { flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: 1.5px solid var(--cinza-300); border-radius: 9px; font: inherit; }
  .dest-mais { font-size: 22px; line-height: 1; color: #fff; background: var(--azul); border-color: var(--azul); }
  .dest-mais:hover { background: #0c2f55; }
  .dest-menos { font-size: 22px; line-height: 1; color: #b42318; }
  .painel { border: 1px solid var(--cinza-200); border-radius: var(--raio); box-shadow: var(--sombra); padding: 22px; background: #fff; }
  .painel h2 { margin: 0 0 4px; font-size: 18px; }
  .drop { margin-top: 16px; border: 2px dashed var(--cinza-300); border-radius: var(--raio); padding: 38px 20px; text-align: center; background: var(--cinza-50); transition: .15s; }
  .drop.over { border-color: var(--azul); background: var(--azul-claro); }
  .drop p { margin: 8px 0 14px; color: var(--cinza-500); }
  .resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0; }
  .kpi { border: 1px solid var(--cinza-200); border-radius: 10px; padding: 12px 14px; background: var(--cinza-50); }
  .kpi b { display: block; font-size: 24px; line-height: 1.1; }
  .kpi span { font-size: 12px; color: var(--cinza-500); }
  .kpi.verde { background: var(--verde-claro); border-color: var(--verde); }
  table.tb { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .tb th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--cinza-500); padding: 8px 10px; border-bottom: 2px solid var(--cinza-200); }
  .tb td { padding: 10px; border-bottom: 1px solid var(--cinza-100); vertical-align: middle; }
  .tb tr:hover td { background: var(--cinza-50); }
  .scroll-x { overflow-x: auto; }

  /* ---------- modal ---------- */
  .ov { position: fixed; inset: 0; background: rgba(10,47,82,.55); display: none; align-items: flex-start; justify-content: center; padding: 28px 14px; z-index: 100; overflow-y: auto; }
  .ov.on { display: flex; }
  .modal { background: #fff; width: 100%; max-width: 760px; border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,.28); border-top: 6px solid var(--verde); overflow: hidden; }
  .modal.sm { max-width: 460px; }
  .m-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 22px 14px; background: var(--azul); color: #fff; }
  .m-head h2 { margin: 0; font-size: 18px; }
  .m-head p { margin: 2px 0 0; font-size: 12.5px; color: var(--verde); }
  .m-x { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 20px; line-height: 1; }
  .m-x:hover { background: rgba(255,255,255,.25); }
  .m-body { padding: 18px 22px 8px; }
  .m-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 22px 18px; border-top: 1px solid var(--cinza-100); background: #fff; position: sticky; bottom: 0; }
  .m-foot .assunto { font-size: 11.5px; color: var(--cinza-500); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-foot .btn.pri { margin-left: auto; }
  .sec { border: 1.5px solid var(--verde); border-radius: 12px; background: #fbfffc; padding: 14px; margin-bottom: 14px; }
  .sec > h3 { margin: 0 0 12px; font-size: 13px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  .loja-save { margin-left: auto; display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .chk-loja { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--cinza-500); }
  .chk-loja { padding: 6px 4px; user-select: none; }
  .chk-loja, .chk-loja * { cursor: pointer; }
  .chk-loja input { width: 18px; height: 18px; margin: 0; accent-color: var(--azul); }
  .chk-loja input:checked + span { color: var(--azul); }
  .loja-save .btn[hidden] { display: none; }
  .sec > h3 i { font-style: normal; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--azul); color: #fff; font-size: 11px; }
  details.sec > summary { cursor: pointer; font-weight: 700; font-size: 13px; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: 'Visualizar preenchimento ▾'; margin-left: auto; font-size: 12px; font-weight: 600; color: var(--cinza-500); }
  details.sec[open] > summary::after { content: 'Fechar ▴'; }
  details.sec .grid { margin-top: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .f { min-width: 0; }
  .f.w2 { grid-column: span 2; }
  .f label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; }
  .f label em { color: var(--perigo); font-style: normal; }
  .f .hint { font-size: 11px; color: var(--cinza-500); margin-top: 4px; }
  .file { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px dashed var(--cinza-300); border-radius: 9px; background: #fff; }
  .file input { font-size: 12.5px; width: 100%; }
  .file.erro { border-color: var(--perigo); background: var(--perigo-bg); }
  .resumo-ro { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 9px 12px; margin-bottom: 12px; border-radius: 9px; background: var(--cinza-100); font-size: 13px; }
  .resumo-ro b { font-weight: 700; }
  .resumo-ro span { color: var(--cinza-500); }
  .info { background: var(--verde-claro); border: 1px solid var(--verde); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .info.az { background: var(--azul-claro); border-color: var(--azul); }
  .lista-kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 0 0 14px; }
  .lista-kv dt { color: var(--cinza-500); font-size: 12px; }
  .lista-kv dd { margin: 0; font-weight: 600; word-break: break-word; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--azul); color: #fff; padding: 11px 18px; border-radius: 10px; box-shadow: 0 8px 26px rgba(0,0,0,.25); z-index: 200; transition: .25s; max-width: 92vw; font-weight: 600; pointer-events: none; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .toast.erro { background: var(--perigo); }
  .carregando { text-align: center; padding: 80px 0; color: var(--cinza-500); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--cinza-200); border-top-color: var(--azul); border-radius: 50%; animation: gira .8s linear infinite; margin: 0 auto 12px; }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* ---------- telas menores: cada linha vira cartão com rótulos ---------- */
  @media (max-width: 1180px) {
    .cab { display: none; }
    .row { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); row-gap: 12px; }
    .row .c::before { content: attr(data-l); display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--cinza-500); margin-bottom: 3px; }
    .row .c-modelo { grid-column: span 2; }
    .row .c-placa { order: -1; }
  }
  @media (max-width: 640px) {
    main { padding: 14px 12px 80px; }
    .topo-in { padding: 12px; }
    .marca h1 { font-size: 17px; }
    .m-body, .m-head, .m-foot { padding-left: 16px; padding-right: 16px; }
    .f.w2 { grid-column: auto; }
    .m-foot { flex-wrap: wrap; }
    .m-foot .assunto { flex-basis: 100%; white-space: normal; }
    .lista-kv { grid-template-columns: 1fr; }
    .filtros { flex-wrap: nowrap; overflow-x: auto; margin-right: -12px; padding-bottom: 4px; }
    .fchip { white-space: nowrap; flex: none; }
    .row2 { gap: 14px; }
    .r2 { width: 100%; }
    .rastreio { flex-wrap: wrap; }
    .rastreio input { flex: 1 1 150px; width: auto; }
  }

  .banner { background: var(--alerta-bg); border: 1px solid #e7c98f; color: var(--alerta); border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; font-size: 13px; }
  .stbtn.pago { background: var(--verde-forte); border-color: var(--verde-forte); color: #fff; }
  .prog { height: 8px; border-radius: 99px; background: var(--cinza-200); margin-top: 10px; overflow: hidden; }
  .prog.big { height: 16px; margin-top: 8px; }
  .prog-box { margin-top: 18px; padding: 18px; border: 1.5px solid var(--verde); border-radius: 12px; background: #fbfffc; }

    const v = el.dataset.id ? getV(el.dataset.id) : null;

    if ((k === 'coleta' || k === 'prazo') && el.value && !/^20\d{2}-\d{2}-\d{2}$/.test(el.value)) return;   // ignora data incompleta
    if (k === 'prazo') { srv('api_salvarPrazo', v.f, v.id, el.value).then(atualiza).catch(falha); return; }
    if (k === 'enviadoem') {
      if (el.value && !/^20\d{2}-\d{2}-\d{2}$/.test(el.value)) return;
      srv('api_salvarEnviadoEm', v.f, v.id, el.value).then(atualiza).catch(falha);
      return;
    }
    if (k === 'coleta') srv('api_salvarColeta', v.f, v.id, el.value).then(atualiza).catch(falha);else if (k === 'rastreio') srv('api_salvarRastreio', v.f, v.id, el.value).then(n => {
      atualiza(n);

    }).catch(x => {
      falha(x);
      el.classList.add('erro');
    });else if (k === 'valor') {
      const n = parseInt(el.value.replace(/\D/g, '') || '0', 10) / 100;
      if (!(n > 0)) { toast('Informe um valor do boleto válido.', true); el.value = mask.money(String(Math.round((Number(v.valorVenda) || 0) * 100))); }
      else if (Math.round(n * 100) !== Math.round((Number(v.valorVenda) || 0) * 100)) srv('api_salvarValor', v.f, v.id, n).then(r => { atualiza(r); toast('Valor do boleto atualizado.'); }).catch(x => { falha(x); el.value = mask.money(String(Math.round((Number(v.valorVenda) || 0) * 100))); });
    } else if (k === 'selLoja') {
      S.loja = el.value;
      S.limite = 60;
      render();
    } else if (k === 'selGcm') {
      S.gcm = el.value;
      S.filtro = 'todos';
      S.limite = 60;
      if (S.view === 'lojas') { render(); return; }
      const ainda = S.sel && S.sel !== '*' && lojasGcm().some(l => l.cnpj === S.sel);
      if (!ainda) S.sel = S.gcm ? '*' : '';
      if (!S.sel) { S.d.veiculos = []; S.d.bases = []; render(); }
      else busy(null, async () => { await carrega(); render(); });
    } else if (k === 'selBase') {

      S.limite = 60;
      if (!S.sel) {
        S.d.veiculos = [];
        S.d.bases = [];
        render();
      } else busy(null, async () => {
        await carrega();
        render();
      });

      const nome = el.dataset.nome;
      srv('api_coordEmail', nome, el.value).then(r => {
        const c = S.coords.find(x => x.nome === nome);
        if (c) { c.email = r.email; }
        render();
        toast(r.email ? 'Usuário salvo: ' + r.email : 'E-mail removido.');
      }).catch(x => { falha(x); el.classList.add('erro'); });
    } else if (k === 'emailLoja') {
      const cnpj = el.dataset.cnpj;
      srv('api_salvarEmailLoja', cnpj, el.value).then(l => {
        const i = S.d.lojas.findIndex(x => x.cnpj === cnpj);
        if (i >= 0) S.d.lojas[i] = l;
        render();
        toast(l.email ? "Acesso liberado para ".concat(l.email) : 'Acesso removido.');
      }).catch(x => {
        falha(x);
        el.classList.add('erro');
      });
    }

  function coleta(root) {
    const o = {};
    root.querySelectorAll('[data-k]').forEach(el => {
      if (!el.readOnly) o[el.dataset.k] = el.value.trim();
    });
    return o;
  }
  function valida(root) {
    let primeiro = null;
    root.querySelectorAll('[data-req]').forEach(el => {
      const bad = !el.value.trim() || el.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(el.value.trim());
      el.classList.toggle('erro', bad);
      if (bad && !primeiro) primeiro = el;
    });
    root.querySelectorAll('details.sec').forEach(d => {
      if (d.querySelector('.erro')) d.open = true;
    });
    if (primeiro) {
      primeiro.scrollIntoView({
        block: 'center',
        behavior: 'smooth'
      });
      primeiro.focus({
        preventScroll: true
      });
      toast('Preencha os campos destacados.', true);
      return false;
    }
    return true;
  }

  function modalNovo() {
    const opcoes = adm() ? S.d.lojas.filter(l => l.fileId).map(l => ({ value: l.fileId, label: l.nome })) : S.d.bases.map(b => ({ value: b.fileId, label: b.nome }));

      '<div class="m-body" id="mf"><div class="grid">' +
      F('fid', 'Loja', { sel: [{ value: '', label: 'Escolha a loja…' }].concat(opcoes), v: pre, req: 1, w2: 1 }) +
      F('placa', 'Placa', { req: 1, mask: 'upper', ph: 'ABC1D23' }) +
      F('modelo', 'Modelo', { req: 1 }) +
      F('chassi', 'Chassi', { mask: 'upper' }) +
      F('valorVenda', 'Valor do Boleto', { req: 1, mask: 'money', ph: 'R$ 0,00' }) +
      F('dtOferta', 'Data Oferta', { type: 'date', req: 1, v: dh }) +
      F('dtLiberacao', 'Data da Liberação', { type: 'date' }) +
      F('dtBoleto', 'Data Boleto', { type: 'date' }) +
      '</div></div>' +
      '<div class="m-foot"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" id="mSalvarNovo">Incluir veículo</button></div>');
    $('#mSalvarNovo').onclick = ev => {
      const root = $('#mf');
      if (!valida(root)) return;
      const d = coleta(root);
      const placa = String(d.placa || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (placa.length !== 7) { toast('Placa inválida (7 caracteres).', true); $('#mf [data-k=placa]').classList.add('erro'); return; }
      const fid = d.fid;
      d.valorVenda = parseInt(String(d.valorVenda).replace(/\D/g, '') || '0', 10) / 100;
      delete d.fid;
      busy(ev.currentTarget, async () => {
        const nv = await srv('api_incluirVeiculo', fid, d);
        if (adm() && S.sel !== '*') S.sel = fid;
        fechaModal();
        S.filtro = 'todos';
        S.busca = '';
        await carrega();
        render();
        toast('Veículo ' + nv.placa + ' incluído.');
      });
    };
  }

  /* ---------- importar planilha (administrador) ---------- */
  /* ---------- barra de progresso da importação ---------- */
  function progHTML(pg) {
    const pct = Math.floor(pg.pct || 0);
    return '<div class="prog-box"><div class="prog-top"><b>' + (pg.fase === 'ler' ? 'Lendo a planilha…' : 'Importando a planilha…') + '</b><span class="prog-pct" id="progPct">' + pct + '%</span></div><div class="prog big"><i id="progBar" style="width:' + pct + '%"></i></div><div class="muted" id="progTxt"></div></div>';
  }
  function atualizaProg() {
    const pg = S.prog;
    if (!pg) return;
    const bar = $('#progBar'), pc = $('#progPct'), tx = $('#progTxt');
    if (!bar) return;
    const n = Math.min(100, Math.floor(pg.pct));
    bar.style.width = n + '%';
    pc.textContent = n + '%';
    const seg = Math.round((Date.now() - pg.inicio) / 1000);
    if (pg.pct >= 100) tx.textContent = 'Concluído!';
    else if (pg.fase === 'ler') tx.textContent = 'Separando as linhas por loja… ' + seg + 's';
    else if (pg.aviso) tx.textContent = pg.aviso + ' ' + seg + 's';
    else tx.textContent = (pg.feitas > 0 ? pg.feitas + ' de ' + pg.total + ' lojas prontas · ' : 'Enviando os dados… ') + seg + 's. Pode levar 1 ou 2 minutos, não feche esta tela.';
  }
  function iniciaProg() {
    terminaProg();
    S.prog = { fase: 'ler', feitas: 0, total: 1, lote: 1, pct: 0, inicio: Date.now() };
    render();
    atualizaProg();
    S.prog.timer = setInterval(() => {
      const pg = S.prog;
      if (!pg || pg.pct >= 100) return;
      if (pg.fase === 'ler') {
        pg.pct += Math.max(0.15, (9 - pg.pct) * 0.06);
        if (pg.pct > 9) pg.pct = 9;
      } else {
        const alvo = 10 + pg.feitas / pg.total * 90;
        const teto = Math.min(98, 10 + Math.min(pg.total, pg.feitas + pg.lote) / pg.total * 90 - 1);
        if (pg.pct < alvo) pg.pct += Math.max(0.6, (alvo - pg.pct) * 0.25);
        else if (pg.pct < teto) pg.pct += Math.max(0.05, (teto - pg.pct) * 0.035);
      }
      atualizaProg();
    }, 150);
  }
  function terminaProg() {
    if (S.prog && S.prog.timer) clearInterval(S.prog.timer);
    S.prog = null;
  }

    return '<div class="painel" style="margin-bottom:16px"><h2>Trazer dados da versão antiga</h2><div class="muted">Use uma vez, na troca de sistema. Escolha o arquivo <b>.json</b> gerado pela função <b>exportarParaMigracao</b> no Google Script. Lojas, veículos e o andamento de cada um (coleta, boleto, envio, rastreio) vêm junto. Pode repetir sem duplicar.</div>' +
      '<label class="btn" style="cursor:pointer;margin-top:14px;display:inline-flex">Escolher arquivo .json<input type="file" id="fMig" accept=".json,application/json" hidden></label>' +
      (S.mig ? '<div class="info' + (S.mig.erro ? '' : ' az') + '" style="margin-top:14px">' + esc(S.mig.erro || S.mig.msg) + '</div>' : '') + '</div>';
  }
  async function migrar(file) {
    S.mig = { msg: 'Lendo o arquivo…' }; render();
    try {
      const d = JSON.parse(await file.text());
      if (!d || !Array.isArray(d.veiculos) || !Array.isArray(d.lojas)) throw new Error('Este arquivo não é o da migração (exportarParaMigracao).');
      const tot = { lojas: 0, veiculos: 0, finalizados: 0, descartados: 0 }, LOTE = 400;
      const r0 = await srvT(150000, 'api_migrar', { lojas: d.lojas, finalizados: d.finalizados || [], veiculos: [] });
      tot.lojas += r0.lojas; tot.finalizados += r0.finalizados;
      for (let i = 0; i < d.veiculos.length; i += LOTE) {
        S.mig = { msg: 'Enviando veículos… ' + Math.min(i + LOTE, d.veiculos.length) + ' de ' + d.veiculos.length }; render();
        const r = await srvT(150000, 'api_migrar', { lojas: [], finalizados: [], veiculos: d.veiculos.slice(i, i + LOTE) });
        tot.veiculos += r.veiculos; tot.descartados += r.descartados;
      }
      await carrega();
      S.coords = null;
      S.mig = { msg: 'Pronto! ' + tot.lojas + ' lojas novas, ' + tot.veiculos + ' veículos com andamento, ' + tot.finalizados + ' finalizados antigos' + (tot.descartados ? ', ' + tot.descartados + ' linhas ignoradas (sem loja ou sem data).' : '.') };
    } catch (e) { S.mig = { erro: 'A migração parou: ' + e.message + ' O que já entrou ficou salvo; pode escolher o arquivo de novo.' }; }
    render();
  }
  document.addEventListener('change', e => { if (e.target.id === 'fMig' && e.target.files[0]) migrar(e.target.files[0]); });
  function modalSenha() {
    abreModal(mHead('Trocar senha', esc(S.d.role !== 'loja' ? S.d.email : (S.d.bases[0] || {}).nome || '')) +
      '<div class="m-body" id="mf"><div class="grid">' + F('s1', 'Nova senha', { type: 'password', req: 1, hint: 'Mínimo de 6 caracteres.' }) + F('s2', 'Repita a nova senha', { type: 'password', req: 1 }) + '</div></div>' +
      '<div class="m-foot"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" id="mSenha">Salvar senha</button></div>', true);
    $('#mSenha').onclick = ev => {
      const d = coleta($('#mf'));
      if (d.s1.length < 6) return toast('A senha precisa ter pelo menos 6 caracteres.', true);
      if (d.s1 !== d.s2) return toast('As duas senhas não são iguais.', true);
      busy(ev.currentTarget, async () => { await API.trocarSenha(d.s1); fechaModal(); toast('Senha trocada.'); });
    };
  }
  function serialParaISO(x) {
    if (x instanceof Date && !isNaN(x)) return x.toISOString().slice(0, 10);
    if (typeof x === 'number') return new Date(Math.round((x - 25569) * 864e5)).toISOString().slice(0, 10);
    const s = String(x || '').trim();
    let m;
    if (m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/)) return "".concat(m[3], "-").concat(m[2], "-").concat(m[1]);
    if (m = s.match(/^(\d{4})-(\d{2})-(\d{2})/)) return "".concat(m[1], "-").concat(m[2], "-").concat(m[3]);
    return '';
  }
  function numero(x) {
    if (typeof x === 'number') return x;
    let s = String(x || '').replace(/[R$\s]/g, '');
    if (!s) return 0;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    return parseFloat(s) || 0;
  }
  async function lerPlanilha(file) {
    S.imp = null;
    iniciaProg();
    await new Promise(r => setTimeout(r, 80));
    try {
      if (typeof XLSX === 'undefined') throw new Error('Biblioteca de leitura não carregou. Verifique a internet e recarregue.');
      const wb = XLSX.read(await file.arrayBuffer(), {
        type: 'array'
      });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {
        header: 1,
        raw: true,
        defval: ''
      });
      if (rows.length < 2) throw new Error('A planilha está vazia.');
      // nomes das colunas sem acento/maiúsculas: "Nº DN" -> "n dn", "Data da Liberação" -> "data da liberacao"
      const norm = h => String(h || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[º°ª.]/g, ' ').replace(/\s+/g, ' ').trim();
      const head = rows[0].map(norm);
      const col = nomes => { for (const nm of nomes) { const i = head.indexOf(nm); if (i >= 0) return i; } return -1; };
      const C = {
        placa: col(['placa']), modelo: col(['modelo']), chassi: col(['chassi']), oferta: col(['data oferta', 'data da oferta']),
        valor: col(['valor do boleto', 'valor boleto']), lib: col(['data da liberacao', 'data liberacao']),
        bol: col(['data boleto', 'data do boleto']), loja: col(['dn', 'loja']), cnpj: col(['cnpj']),
        ndn: col(['n dn', 'no dn', 'numero dn', 'n do dn']), coord: col(['coordenador']), gcm: col(['gcm'])
      };
      const falta = [['placa', 'PLACA'], ['modelo', 'MODELO'], ['oferta', 'Data Oferta'], ['loja', 'DN'], ['cnpj', 'CNPJ']].filter(([k]) => C[k] < 0).map(x => x[1]);
      if (falta.length) throw new Error('A planilha não está no modelo: faltam as colunas ' + falta.join(', ') + '. Clique em "Baixar modelo da planilha" e use esse arquivo.');
      const cel = (r, i) => i < 0 ? '' : r[i];
      const txt = (r, i) => String(cel(r, i) == null ? '' : cel(r, i)).trim();
      const ok = [];
      let semLoja = 0,
        semData = 0,
        total = 0;
      rows.slice(1).forEach(r => {
        if (!txt(r, C.placa)) return;
        total++;
        const loja = txt(r, C.loja),
          cnpj = txt(r, C.cnpj).replace(/\D/g, '').padStart(14, '0');
        const dtOferta = serialParaISO(cel(r, C.oferta));
        if (!loja || cnpj === '00000000000000') {
          semLoja++;
          return;
        }
        if (!dtOferta) {
          semData++;
          return;
        }
        ok.push({
          placa: txt(r, C.placa).toUpperCase(),
          modelo: txt(r, C.modelo),
          chassi: txt(r, C.chassi).toUpperCase(),
          valorBoleto: numero(cel(r, C.valor)),
          dtOferta,
          dtLiberacao: serialParaISO(cel(r, C.lib)),
          dtBoleto: serialParaISO(cel(r, C.bol)),
          loja,
          cnpj,
          nDn: txt(r, C.ndn),
          coordenador: txt(r, C.coord).toUpperCase(),
          gcm: txt(r, C.gcm).toUpperCase()
        });
      });
      S.imp = {
        total,
        ok,
        semLoja: semLoja + semData,
        semLoja_: semLoja,
        semData,
        lojas: new Set(ok.map(x => x.cnpj)).size
      };
    } catch (e) {
      S.imp = {
        erro: e.message
      };
    }
    if (S.imp.erro || !S.imp.ok.length) {
      terminaProg();
      if (!S.imp.erro) S.imp.erro = S.imp.semData && !S.imp.semLoja_ ? 'Nenhuma linha tem uma data válida na coluna "Data Oferta" (' + S.imp.semData + ' linhas). Confira essas colunas na planilha.' : 'Nenhuma linha com loja e CNPJ foi encontrada nessa planilha.';
      render();
      return;
    }
    importar();
  }
  document.addEventListener('change', e => {
    if (e.target.id === 'fPlan' && e.target.files[0]) lerPlanilha(e.target.files[0]);
  });
  function importar() {
    // envia algumas lojas por vez
    const porLoja = {};
    S.imp.ok.forEach(x => (porLoja[x.cnpj] = porLoja[x.cnpj] || []).push(x));
    const cnpjs = Object.keys(porLoja),
      LOTE = 15,
      tot = {
        novos: 0,
        atualizados: 0,
        lojasNovas: 0, existentes: 0, ignorados: 0
      };
    (async () => {
      S.prog.fase = 'enviar';
      S.prog.total = cnpjs.length;
      S.prog.lote = LOTE;
      S.prog.feitas = 0;
      render();
      atualizaProg();
      try {
        for (let i = 0; i < cnpjs.length; i += LOTE) {
          const rows = [].concat(...cnpjs.slice(i, i + LOTE).map(c => porLoja[c]));
          let r = null;
          for (let t = 1; !r; t++) {
            try {
              r = await srvT(150000, 'api_importarLote', rows);
            } catch (e) {
              // tenta de novo (lote ocupado ou resposta lenta); o que já entrou não duplica
              if (t >= 3) throw e;
              S.prog.aviso = 'O servidor demorou; tentando de novo (' + t + ' de 2)…';
              atualizaProg();
              await new Promise(r2 => setTimeout(r2, 4000));
            }
          }
          S.prog.aviso = '';
          tot.novos += r.novos;
          tot.atualizados += r.atualizados;
          tot.lojasNovas += r.lojasNovas; tot.existentes += r.existentes || 0; tot.ignorados += r.ignorados || 0;
          S.prog.feitas = Math.min(cnpjs.length, i + LOTE);
          atualizaProg();
        }
        S.prog.feitas = cnpjs.length;
        S.prog.pct = 100;
        atualizaProg();
        await new Promise(r => setTimeout(r, 700));
        S.imp = null;
        terminaProg();
        await carrega();
        S.coords = null;   // coordenadores podem ter mudado com a planilha
        S.view = 'lojas';
        render();
        toast(tot.novos + " veículos novos · " + tot.existentes + " já estavam na lista (não duplicados)" + (tot.ignorados ? " · " + tot.ignorados + " já finalizados" : "") + (tot.lojasNovas ? " · " + tot.lojasNovas + " lojas novas" : "") + ".");
      } catch (err) {
        const feitas = S.prog ? S.prog.feitas : 0;
        terminaProg();
        S.imp = {
          erro: 'A importação parou em ' + feitas + ' de ' + cnpjs.length + ' lojas: ' + String(err.message).replace(/[.\s]+$/, '') + '. O que já entrou ficou salvo e não duplica. Escolha a planilha de novo para continuar de onde parou.'
        };
        render();
        toast('A importação parou. Veja a mensagem na tela.', true);
      }
    })();
  }
  document.addEventListener('dragover', e => {
    const d = e.target.closest('#drop');
    if (d) {
      e.preventDefault();
      d.classList.add('over');
    }
  });
  document.addEventListener('dragleave', e => {
    const d = e.target.closest('#drop');
    if (d) d.classList.remove('over');
  });
  document.addEventListener('drop', e => {
    const d = e.target.closest('#drop');
    if (d) {
      e.preventDefault();
      d.classList.remove('over');
      if (e.dataTransfer.files[0]) lerPlanilha(e.dataTransfer.files[0]);
    }
  });

  /* ---------- lojas e acessos (administrador) ---------- */
  function viewLojas() {
    const ls = lojasGcm(),
      pend = ls.filter(l => !l.liberado).length;
    const acesso = l => {
      const st = l.liberado ? '<span class="ac-ok">✓ Senha criada</span>' : '<span class="ac-no">Sem senha</span>';
      const cod = l.codigo ? '<div class="ac-cod"><b class="mono">' + esc(l.codigo) + '</b><button class="ibtn" data-act="copiarCodigo" data-cnpj="' + l.cnpj + '" title="Copiar mensagem para a loja">' + I.copiar + '</button><small>vale até ' + fdata(new Date(new Date(l.codigoEm).getTime() + 7 * 864e5).toISOString()) + '</small></div>' : '';
      return st + cod;
    };
    const filtroGcm = selGcmHTML() ? '<div class="barra" style="margin:14px 0 0">' + selGcmHTML() + (S.gcm ? '<span class="muted">' + ls.length + ' loja' + (ls.length > 1 ? 's' : '') + ' deste GCM</span>' : '') + '</div>' : '';
    return '<div class="painel"><h2>Lojas e acessos</h2><div class="muted">O <b>usuário</b> de cada loja é o <b>CNPJ</b> (só números). Clique em <b>Gerar código</b> e passe o código para a loja: no primeiro acesso ela digita o CNPJ, o código e cria a própria senha. Esqueceu a senha? Gere um código novo (vale 7 dias).</div>' + filtroGcm +
      (pend ? '<div class="info az" style="margin-top:14px">' + pend + ' loja' + (pend > 1 ? 's' : '') + ' ainda sem senha.</div>' : '') +
      (ls.length ? '<div class="scroll-x"><table class="tb"><thead><tr><th>Loja</th><th>Nº DN</th><th>Usuário (CNPJ)</th><th>GCM</th>' + (admTotal() ? '<th>Coordenador</th>' : '') + '<th>Veículos</th><th>Acesso</th><th></th></tr></thead><tbody>' +
        ls.map(l => '<tr><td><strong>' + esc(l.nome) + '</strong></td><td>' + esc(l.nDn || '—') + '</td><td><span class="mono">' + esc(l.cnpj) + '</span></td><td>' + esc(l.gcm || '—') + '</td>' + (admTotal() ? '<td>' + esc(l.coordenador || '—') + '</td>' : '') + '<td>' + l.total + '</td>' +
          '<td style="min-width:230px">' + acesso(l) + '</td>' +
          '<td style="white-space:nowrap"><button class="btn sm" data-act="gerarCodigo" data-cnpj="' + l.cnpj + '">' + (l.codigo || l.liberado ? 'Novo código' : 'Gerar código') + '</button> ' +
          '<button class="btn sm" data-act="verLoja" data-f="' + esc(l.fileId) + '">Ver veículos</button></td></tr>').join('') +
        '</tbody></table></div>' : '<div class="vazio" style="margin-top:16px">Nenhuma loja ainda. Elas são criadas automaticamente ao importar a planilha.</div>') + '</div>' + viewCoords();
  }
  function viewCoords() {
    if (!admTotal()) return '';
    if (!S.coords) { srv('api_coordListar').then(c => { S.coords = c; if (S.view === 'lojas') render(); }).catch(x => toast(x.message, true)); return '<div class="painel coord-box"><h2>Coordenadores</h2><div class="muted">Carregando…</div></div>'; }
    const cs = S.coords;
    const ac = c => (c.temSenha ? '<span class="ac-ok">✓ Senha criada</span>' : '<span class="ac-no">Sem senha</span>') +
      (c.codigo ? '<div class="ac-cod"><b class="mono">' + esc(c.codigo) + '</b><button class="ibtn" data-act="copiarCodCoord" data-nome="' + esc(c.nome) + '" title="Copiar mensagem para o coordenador">' + I.copiar + '</button><small>vale até ' + fdata(new Date(new Date(c.codigoEm).getTime() + 7 * 864e5).toISOString()) + '</small></div>' : '');
    return '<div class="painel coord-box"><h2>Coordenadores</h2><div class="muted">O coordenador vê e altera só as lojas em que o nome dele está na coluna <b>COORDENADOR</b> da planilha. Cadastre o <b>e-mail</b> (será o usuário dele), gere o código e envie: ele cria a senha em "Primeiro acesso".</div>' +
      (cs.length ? '<div class="scroll-x"><table class="tb"><thead><tr><th>Coordenador</th><th>Lojas</th><th>Usuário (e-mail)</th><th>Acesso</th><th></th></tr></thead><tbody>' +
        cs.map(c => '<tr><td><strong>' + esc(c.nome) + '</strong></td><td>' + c.lojas + '</td>' +
          '<td><input type="email" value="' + esc(c.email) + '" placeholder="email@empresa.com" data-chg="coordEmail" data-nome="' + esc(c.nome) + '"></td>' +
          '<td style="min-width:200px">' + ac(c) + '</td>' +
          '<td><button class="btn sm" data-act="coordCodigo" data-nome="' + esc(c.nome) + '">' + (c.codigo || c.temSenha ? 'Novo código' : 'Gerar código') + '</button></td></tr>').join('') +
        '</tbody></table></div>' : '<div class="vazio" style="margin-top:12px">Nenhum coordenador na planilha ainda (coluna COORDENADOR).</div>') + '</div>';
  }


  /* ---------- e-mails de envio (administrador) ---------- */
  const DEST_TIPOS = [['boleto', 'Solicitar boleto', 'Recebem o pedido de boleto de todas as lojas.'], ['docs', 'Pedir documento', 'Recebem o pedido de documento (ATPV) de todas as lojas.']];
  function viewDestinos() {
    const L = S.d.destinosListas || { boleto: [], docs: [] };
    const caixa = t => {
      const lista = L[t[0]] || [];
      const itens = lista.length ? lista.map((d, i) => '<div class="dest-item' + (d.ativo ? '' : ' off') + '"><label class="dest-chk" title="' + (d.ativo ? 'Recebendo. Desmarque para pausar.' : 'Pausado. Marque para voltar a receber.') + '"><input type="checkbox" data-act="destTog" data-t="' + t[0] + '" data-i="' + i + '"' + (d.ativo ? ' checked' : '') + '><span class="dest-mail">' + esc(d.email) + '</span><span class="dest-tag">' + (d.ativo ? 'ativo' : 'pausado') + '</span></label><button class="ibtn dest-menos" title="Remover da lista" aria-label="Remover ' + esc(d.email) + '" data-act="destDel" data-t="' + t[0] + '" data-i="' + i + '">&minus;</button></div>').join('') : '<div class="muted" style="padding:10px 0">Nenhum e-mail cadastrado. Sem e-mails ativos, as lojas não conseguem enviar.</div>';
      const nAt = lista.filter(d => d.ativo).length, aviso = lista.length && !nAt ? '<div class="dest-aviso">Todos estão pausados: as lojas não conseguem enviar até você ativar pelo menos um.</div>' : '';
      return '<div class="painel dest-box"><h2>' + t[1] + '</h2><div class="muted">' + t[2] + '</div>' + aviso + '<div class="dest-lista">' + itens + '</div><div class="dest-novo"><input type="email" id="dn-' + t[0] + '" data-dnovo="' + t[0] + '" placeholder="novo.email@empresa.com" autocomplete="off"><button class="ibtn dest-mais" title="Adicionar" aria-label="Adicionar e-mail" data-act="destAdd" data-t="' + t[0] + '">+</button></div></div>';
    };
    return '<div class="dest-grid">' + DEST_TIPOS.map(caixa).join('') + '</div><div class="muted" style="margin-top:12px">As alterações valem na hora para todas as lojas. Só os e-mails marcados recebem, todos juntos no mesmo envio. Desmarque para pausar (férias, ausência) sem perder o cadastro.</div>';
  }
  function salvaDestinos(tipo, lista, msg) {
    return srv('api_salvarDestinos', tipo, lista).then(r => {
      S.d.destinosListas = r.listas;
      S.d.destinatarios = r.opcoes;
      render();
      toast(msg);
    }).catch(x => { toast(x.message, true); });
  }

  /* ---------- início ---------- */
  function arranca(d) {
    window.__ok = true;
    d.veiculos.forEach(norm);
    S.d = d;
    S.view = d.role !== 'loja' ? 'lojas' : 'veiculos';
    if (d.role === 'admin' && !d.lojas.length) S.view = 'importar';
    render();
  }
  const falhaInicial = msg => {
    window.__ok = true;
    $('#main').innerHTML = "<div class=\"vazio\"><h3>Não foi possível carregar</h3><p>".concat(esc(msg), "</p></div>");
  };
  window.addEventListener('error', e => {
    if (!S.d) falhaInicial('Erro na tela: ' + e.message);
  });
  if (INICIAL && INICIAL.ok) {
    try {
      arranca(INICIAL.d);
    } catch (e) {
      falhaInicial('Erro ao montar a tela: ' + e.message);
    }
  } else if (INICIAL) falhaInicial(INICIAL.erro);else API.iniciar().then(d => { if (d) arranca(d); else window.__ok = true; }).catch(e => falhaInicial(e.message));

})();
</script>
